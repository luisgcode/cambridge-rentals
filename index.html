<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Cambridge Rentals</title>
<style>
  :root {
    --bg: #f5f5f5; --surface: #ffffff; --bar: #1d1d1d; --ink: #1a1a1a; --ink-soft: #777777;
    --line: rgba(0,0,0,0.10); --accent: #d9314e; --ok: #1a8a4a; --ok-soft: rgba(26,138,74,0.10);
    --pending: #b07d10; --pending-soft: rgba(176,125,16,0.12);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .apphead { height: 52px; background: var(--bar); display: flex; align-items: center; gap: 12px; padding: 0 max(16px, env(safe-area-inset-left)); }
  .apphead p { margin: 0; color: #fff; font-size: 15px; font-weight: 500; }
  .apphead .upd { margin-left: auto; color: rgba(255,255,255,.6); font-size: 12.5px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 22px 16px 60px; }
  .crit { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
  .summary b { font-size: 18px; margin-right: 5px; }
  .tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 6px; padding: 8px 0; margin-bottom: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; background: var(--surface); border: 1px solid rgba(0,0,0,.16); border-radius: 20px; padding: 10px 16px; font: 600 14px var(--sans); color: var(--ink-soft); cursor: pointer; }
  .actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; }
  .btn.call { background: var(--ok); color: #fff; }
  .btn.view { background: var(--accent); color: #fff; }
  .btn.solo { grid-column: 1 / -1; }
  /* Responsive: 1 column on phones, 2 on tablets, 3 or 4 on desktop, as wide as the screen allows */
  .wrap { max-width: 1600px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; align-items: start; }
  #list .card { margin-bottom: 0; }
  #list .empty { grid-column: 1 / -1; }
  .summary, .crit, .tabs { max-width: 100%; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; }
  .row { font-size: 15px !important; }
  .meta { font-size: 13.5px !important; }
  .card.discarded { opacity: .5; }
  .card.discarded .bname, .card.discarded .rent { text-decoration: line-through; }
  .bname { font-weight: 700; font-size: 16px; }
  .bname a { color: var(--ink); text-decoration: none; }
  .bname a:hover { color: var(--accent); text-decoration: underline; }
  .rent { font-weight: 700; font-size: 18px; text-align: right; }
  .meta { color: var(--ink-soft); font-size: 13px; grid-column: 1 / -1; }
  .row { font-size: 13.5px; grid-column: 1 / -1; }
  .row span { color: var(--ink-soft); }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 10px; justify-self: end; }
  .pill.located { background: var(--pending-soft); color: var(--pending); }
  .pill.contacted { background: var(--ok-soft); color: var(--ok); }
  .pill.discarded { background: #eee; color: #888; }
  .photo { grid-column: 1 / -1; display: block; margin: -16px -16px 6px; width: calc(100% + 32px); max-width: none; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px 10px 0 0; background: #e8e8e8; }
  .card.discarded .photo { filter: grayscale(1); }
  .why { grid-column: 1 / -1; font-size: 14px; font-weight: 600; color: #8a1c2c; background: rgba(217,49,78,.08); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 4px; }
  .card.discarded { opacity: 1; }
  .card.discarded .row, .card.discarded .meta, .card.discarded .actions { opacity: .55; }
  .src { grid-column: 1 / -1; justify-self: start; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #fff; padding: 4px 10px; border-radius: 4px; }
  .src.zumper { background: #3a5bd9; }
  .src.rentals { background: #e6731c; }
  .src.realtor { background: #c8102e; }
  .src.marketplace { background: #1877f2; }
  .src.kijiji { background: #373373; }
  .src.viewit { background: #0a8f6a; }
  .src.livrent { background: #ff5a5f; }
  .src.other { background: #555; }
  .new { color: var(--accent); font-size: 11px; font-weight: 700; margin-left: 6px; }
  .open { grid-column: 1 / -1; justify-self: start; margin-top: 6px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; font-weight: 600; }
  .empty { color: var(--ink-soft); padding: 20px 0; }
  .mark { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .mbtn { flex: 1 1 auto; min-height: 42px; border-radius: 8px; border: 1px solid rgba(0,0,0,.18); background: var(--surface); font: 600 14px var(--sans); color: var(--ink); cursor: pointer; padding: 0 12px; }
  .mbtn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .mbtn.bad { color: #8a1c2c; border-color: rgba(217,49,78,.4); }
  .discard-box { grid-column: 1 / -1; display: grid; gap: 8px; }
  .discard-box textarea { width: 100%; min-height: 70px; font: 15px var(--sans); padding: 10px; border: 1px solid rgba(0,0,0,.2); border-radius: 8px; resize: vertical; }
  .discard-box .row2 { display: flex; gap: 8px; }
  .saving { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-soft); }
  .saving.err { color: #b00020; }
  .banner { background: #fff4d6; border: 1px solid #e8cf83; color: #6b5200; font-size: 13px; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
</style>
<script src="config.js"></script>
</head>
<body>
<header class="apphead"><p>Cambridge Rentals</p><span class="upd" id="upd"></span></header>
<main class="wrap">
  <p class="crit" id="crit"></p>
  <div class="summary" id="sum"></div>
  <div class="tabs">
    <button class="tab on" data-f="active">Active</button>
    <button class="tab" data-f="located">Located</button>
    <button class="tab" data-f="contacted">Contacted</button>
    <button class="tab" data-f="discarded">Discarded</button>
    <button class="tab" data-f="all">All</button>
  </div>
  <div class="banner" id="banner" hidden>Changes are saved on this device only. To make them live on every device, the shared store key has to be set in config.js.</div>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<script>
  var LABEL = { located: 'Located', contacted: 'Contacted', discarded: 'Discarded' };
  var data = null, filter = 'active', marks = {}, openBox = null;
  // Marks typed on the page (status + note) live in a shared JSON store, keyed by listing id.
  // A mark remembers the rent it was made at: if the rent changes, the mark no longer applies
  // and the listing shows up again as Located with PRICE CHANGED.
  var SHARED = !!(window.RENT_BIN && window.RENT_KEY);
  var API = 'https://api.jsonbin.io/v3/b/' + (window.RENT_BIN || '');
  var LOCAL = 'cambridge-rentals-marks';
  function readLocal() { try { return JSON.parse(localStorage.getItem(LOCAL) || '{}'); } catch (e) { return {}; } }
  function writeLocal(m) { try { localStorage.setItem(LOCAL, JSON.stringify(m)); } catch (e) {} }
  function pullMarks() {
    if (!SHARED) return Promise.resolve(readLocal());
    return fetch(API + '/latest', { headers: { 'X-Master-Key': window.RENT_KEY } })
      .then(function (r) { return r.json(); })
      .then(function (d) { var m = (d && d.record) || {}; delete m._empty; writeLocal(m); return m; })
      .catch(function () { return readLocal(); });
  }
  function pushMarks(id) {
    writeLocal(marks);
    if (!SHARED) { flash(id, 'Saved on this device', false); return; }
    flash(id, 'Saving…', false);
    var payload = Object.keys(marks).length ? marks : { _empty: true };
    fetch(API, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': window.RENT_KEY }, body: JSON.stringify(payload) })
      .then(function (r) { flash(id, r.ok ? 'Saved ✓' : 'Not saved, try again', !r.ok); })
      .catch(function () { flash(id, 'Not saved, check the connection', true); });
  }
  function flash(id, text, err) {
    var el = document.querySelector('.saving[data-id="' + id + '"]');
    if (el) { el.textContent = text; el.className = 'saving' + (err ? ' err' : ''); }
  }
  function effective(x) {
    var m = marks[x.id];
    if (m && Number(m.rent) === Number(x.rent)) return { status: m.status, reason: m.reason || '' };
    if (m && Number(m.rent) !== Number(x.rent)) return { status: 'located', reason: '', prevRent: m.rent };
    return { status: x.status, reason: x.discardReason || '' };
  }
  function setMark(id, status, reason) {
    var x = data.listings.filter(function (l) { return l.id === id; })[0];
    if (!x) return;
    if (status === 'located') delete marks[id];
    else marks[id] = { status: status, reason: reason || '', rent: x.rent, at: new Date().toISOString().slice(0, 10) };
    openBox = null;
    render();
    pushMarks(id);
  }
  function markControls(x, st) {
    if (openBox === x.id) {
      return '<div class="discard-box"><textarea id="why-' + x.id + '" placeholder="Why are we discarding it? (for example: basement, only 1 bedroom, already rented)"></textarea>' +
        '<div class="row2"><button class="mbtn bad" data-act="confirm" data-id="' + x.id + '">Save as discarded</button><button class="mbtn" data-act="cancel" data-id="' + x.id + '">Cancel</button></div></div>';
    }
    if (st === 'discarded') return '<div class="mark"><button class="mbtn" data-act="restore" data-id="' + x.id + '">Restore</button></div><div class="saving" data-id="' + x.id + '"></div>';
    return '<div class="mark">' +
      '<button class="mbtn' + (st === 'contacted' ? ' on' : '') + '" data-act="contacted" data-id="' + x.id + '">' + (st === 'contacted' ? '✓ Contacted' : 'Mark contacted') + '</button>' +
      '<button class="mbtn bad" data-act="discard" data-id="' + x.id + '">Discard…</button></div>' +
      '<div class="saving" data-id="' + x.id + '"></div>';
  }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function actions(x) {
    var tel = (String(x.contact || '').match(/\(?\d{3}\)?[\s.-]?\d{3}-\d{4}/) || [''])[0];
    var num = tel.replace(/\D/g, '');
    var view = '<a class="btn view' + (num ? '' : ' solo') + '" href="' + esc(x.url) + '" target="_blank" rel="noopener">View listing</a>';
    var call = num ? '<a class="btn call" href="tel:+1' + num + '">Call ' + esc(tel) + '</a>' : '';
    return '<div class="actions">' + call + view + '</div>';
  }
  function render() {
    var L = data.listings.map(function (o) {
      var e = effective(o), x = {};
      for (var k in o) x[k] = o[k];
      x.status = e.status; x.discardReason = e.reason; if (e.prevRent) x.prevRent = e.prevRent;
      return x;
    }).sort(function (a, b) { return (b.found || '').localeCompare(a.found || '') || a.rent - b.rent; });
    var rows = L.filter(function (x) { return filter === 'all' ? true : filter === 'active' ? x.status !== 'discarded' : x.status === filter; });
    var html = rows.map(function (x) {
      var isNew = x.found === data.updated && x.status === 'located';
      var s = String(x.source || '').toLowerCase();
      var sc = /zumper/.test(s) ? 'zumper' : /rentals/.test(s) ? 'rentals' : /realtor/.test(s) ? 'realtor' : /marketplace|facebook/.test(s) ? 'marketplace' : /kijiji/.test(s) ? 'kijiji' : /viewit/.test(s) ? 'viewit' : /liv/.test(s) ? 'livrent' : 'other';
      return '<div class="card ' + x.status + '">' +
        (x.photo ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener" style="display:contents"><img class="photo" src="' + esc(x.photo) + '" alt="' + esc(x.building) + '" loading="lazy" referrerpolicy="no-referrer"></a>' : '') +
        (x.status === 'discarded' && x.discardReason ? '<div class="why">Discarded: ' + esc(x.discardReason) + '</div>' : '') +
        '<span class="src ' + sc + '">' + esc(x.source) + '</span>' +
        '<div class="bname"><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.building) + ' ↗</a>' + (isNew ? '<span class="new">NEW</span>' : '') + '</div>' +
        '<div class="rent">$' + Number(x.rent).toLocaleString('en-CA') + '</div>' +
        (x.prevRent ? '<div class="row" style="color:var(--accent);font-weight:700">PRICE CHANGED: $' + Number(x.prevRent).toLocaleString('en-CA') + ' → $' + Number(x.rent).toLocaleString('en-CA') + '</div>' : '') +
        '<div class="meta">' + esc(x.address) + ' · found ' + esc(x.found) + '</div>' +
        '<div class="row">' + esc(x.unit) + ' · <b>' + esc(x.pets) + '</b>' + (x.parking ? ' · Parking: ' + esc(x.parking) : '') + (x.available ? ' · ' + esc(x.available) : '') + '</div>' +
        '<div class="row"><span>Contact:</span> ' + esc(x.contact) + '</div>' +
        '<div class="row"><span>How to book:</span> ' + esc(x.howToBook) + '</div>' +
        (x.notes ? '<div class="row"><span>Notes:</span> ' + esc(x.notes) + '</div>' : '') +
        '<span class="pill ' + x.status + '" style="grid-column:1/-1;justify-self:start">' + LABEL[x.status] + '</span>' +
        actions(x) +
        markControls(x, x.status) +
        '</div>';
    }).join('');
    document.getElementById('list').innerHTML = html || '<p class="empty">Nothing here yet.</p>';
    var c = function (s) { return L.filter(function (x) { return x.status === s; }).length; };
    var nNew = L.filter(function (x) { return x.found === data.updated && x.status === 'located'; }).length;
    document.getElementById('sum').innerHTML = '<span><b>' + nNew + '</b>new today</span><span><b>' + c('located') + '</b>located</span><span><b>' + c('contacted') + '</b>contacted</span><span><b>' + c('discarded') + '</b>discarded</span>';
  }
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.getAttribute('data-f');
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === b); });
      render();
    });
  });
  document.getElementById('list').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-act]');
    if (!b) return;
    var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
    if (act === 'contacted') {
      var cur = marks[id] && marks[id].status === 'contacted';
      setMark(id, cur ? 'located' : 'contacted', '');
    } else if (act === 'discard') {
      openBox = id; render();
      var t = document.getElementById('why-' + id); if (t) t.focus();
    } else if (act === 'cancel') {
      openBox = null; render();
    } else if (act === 'confirm') {
      var why = (document.getElementById('why-' + id) || {}).value || '';
      setMark(id, 'discarded', why.trim());
    } else if (act === 'restore') {
      setMark(id, 'located', '');
    }
  });
  document.getElementById('banner').hidden = SHARED;
  Promise.all([
    fetch('data.json?v=' + Date.now()).then(function (r) { return r.json(); }),
    pullMarks()
  ]).then(function (res) {
    data = res[0]; marks = res[1] || {};
    document.getElementById('upd').textContent = 'Updated ' + data.updated;
    document.getElementById('crit').textContent = data.criteria;
    render();
  }).catch(function () { document.getElementById('list').innerHTML = '<p class="empty">Could not load the listings. Refresh the page.</p>'; });
</script>
</body>
</html>
